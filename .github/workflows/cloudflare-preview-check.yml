name: Verify Cloudflare migration build
on:
  push:
    branches: [cloudflare-migration-preview]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build complete static website for Cloudflare
        run: bash scripts/build-cloudflare.sh
      - name: Validate output limits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("public")
          files=[p for p in root.rglob("*") if p.is_file()]
          huge=[(str(p),p.stat().st_size) for p in files if p.stat().st_size>25*1024*1024]
          assert not huge, huge
          assert len(files)<=20000,len(files)
          print(f"Validated {len(files)} assets, {sum(p.stat().st_size for p in files)/1048576:.2f} MiB")
          PY
      - name: Retain complete deployment bundle for review
        uses: actions/upload-artifact@v4
        with:
          name: paksights-cloudflare-preview
          path: public/
          retention-days: 7
