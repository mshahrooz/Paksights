name: Export standalone Cloudflare site bundle
on:
  push:
    branches:
      - cloudflare-migration-preview
    paths:
      - .github/workflows/export-cloudflare-bundle.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete site source
        uses: actions/checkout@v4
      - name: Build and validate Cloudflare site
        run: bash scripts/build-cloudflare.sh
      - name: Package complete editable source and deploy-ready public directory
        run: |
          tar --exclude=.git --exclude=.github -czf paksights-cloudflare-bundle.tar.gz -- .
          sha256sum paksights-cloudflare-bundle.tar.gz > paksights-cloudflare-bundle.sha256
      - name: Make one-time migration backup available
        uses: actions/upload-artifact@v4
        with:
          name: paksights-cloudflare-standalone-bundle
          path: |
            paksights-cloudflare-bundle.tar.gz
            paksights-cloudflare-bundle.sha256
          retention-days: 90
