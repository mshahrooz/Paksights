name: Deploy Leonida Ledger to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Rebuild the Google News 48-hour sitemap daily while the workflow stays active.
    - cron: '17 4 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check JavaScript syntax and essentials
        run: |
          node --check assets/site.js
          node --check assets/gta-photo-lab.js
          node --check assets/gta-photo-lab-cloud.js
          node --check assets/tools.js
          node --check assets/mission-article.js
          node --check assets/prologue.js
          node --check scripts/build-seo.mjs
          node --check scripts/submit-indexnow.mjs
          test -s scripts/seo-page-data.json
          test -s assets/publisher-logo.svg
          test -s articles/gta-6-prologue-mission-1-walkthrough.html
          test -s articles/gta-6-news-today-november-23-2026.html
          test -s assets/editorial/2026-11-23/gta-vi-monday-launch-roundup.avif
          test -s assets/editorial/2026-11-23/gta-vi-xbox-framerate-glitch.avif
          test -s assets/editorial/2026-11-23/gta-vi-character-critics.avif
          test -s assets/editorial/2026-11-23/gta-vi-launch-city.avif
          test -s assets/editorial/2026-11-23/gta-vi-soundtrack-vinyl.avif
          test -s articles/gta-vi-all-missions.html
          test -s articles/gta6-deep-sea-fishing-52-screenshots-20-seconds.html
          test -s scripts/assemble-fishing-frames.py
          test -s assets/gta6-deep-sea-fishing/_video-parts/part-030.bin
          test -s tools/index.html
          test -s tools/gta-vi-ai-photo-generator.html
          test -s articles/gta-vi-ai-character-photo-trend-2026.html
          test -s tools/leonida-map.html
          test -s tools/safe-codes.html
          test -s tools/mission-tracker.html
          test -s index.html
          test -s sitemap.xml
          test -s ads.txt
      - name: Verify and assemble 52 enhanced screenshots
        run: |
          python scripts/assemble-fishing-frames.py
      - name: Commit expanded screenshots into GitHub
        continue-on-error: true
        run: |
          if test -d assets/media-source/gta6-fishing; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/gallery/gta6-fishing-20s
            git rm -r --quiet assets/media-source/gta6-fishing
            if ! git diff --cached --quiet; then
              git commit -m "Store 52 enhanced 20-second screenshot files"
              git push origin HEAD:main
            fi
          fi
      - name: Prepare published site
        run: |
          mkdir public
          cp -R assets articles news guides world features tools public/
          # Reassemble the compressed 17 MB user-provided fishing video from Git blobs.
          cat public/assets/gta6-deep-sea-fishing/_video-parts/part-*.bin > public/assets/gta6-deep-sea-fishing/gta6-deep-sea-fishing-ultra.mp4
          test "$(stat -c%s public/assets/gta6-deep-sea-fishing/gta6-deep-sea-fishing-ultra.mp4)" -eq 17794634
          rm -rf public/assets/gta6-deep-sea-fishing/_video-parts
          rm -rf public/assets/media-source
          cp *.html *.xml *.txt CNAME .nojekyll public/
          # Build clean page-level SEO metadata and feeds from actual HTML, preserving dates.
          node scripts/build-seo.mjs public
          python - <<'PY'
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET
          root = Path('public')
          for p in ['sitemap.xml','sitemap-news.xml','sitemap-index.xml','feed.xml','feed-news.xml','atom.xml']:
              ET.parse(root / p)
          assert len(list(ET.parse(root / 'sitemap.xml').getroot())) >= 35
          assert len(json.loads((root / 'feed.json').read_text())['items']) >= 15
          assert '<meta name="google-site-verification"' in (root / 'index.html').read_text()
          print('SEO validation passed: XML feeds, sitemaps, JSON feed, homepage ownership tag.')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Wait for Pages artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Pages API can lag behind successful artifact uploads.
          # Wait until this exact workflow run exposes exactly one github-pages artifact.
          count=0
          for attempt in $(seq 1 15); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' || echo 0)
            echo "Pages artifact visibility attempt ${attempt}: ${count}"
            if [ "${count}" = "1" ]; then
              sleep 5
              break
            fi
            sleep 5
          done
          test "${count}" = "1"
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify IndexNow of newly published pages (best effort)
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs
